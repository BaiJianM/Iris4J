# Debezium Server 配置：PostgreSQL source -> Redis Stream sink
# 第二个 Debezium 实例，验证 iris4j 多源 CDC（MySQL + PostgreSQL）。
# 参考：https://debezium.io/documentation/reference/stable/connectors/postgresql.html

# ---------- Source: PostgreSQL ----------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.password=debezium
debezium.source.database.dbname=iris_demo
debezium.source.topic.prefix=iris_pg
# 逻辑复制插件：pgoutput（PostgreSQL 10+ 内置，无需额外安装 wal2json/decoderbufs）
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_pg
debezium.source.publication.name=dbz_publication
# 只同步 product 表（PG 的 schema 是 public；topic = iris_pg.public.product）
debezium.source.table.include.list=public.product
debezium.source.snapshot.mode=initial
# 关闭 delete 后的 tombstone 事件（Redis Stream sink 会把 tombstone 写成裸字符串，消费端无意义）
debezium.source.tombstones.on.delete=false
# NUMERIC/DECIMAL 默认 precise 会输出 base64 二进制；这里转 double 让 price 变成可读 JSON 数字
debezium.source.decimal.handling.mode=double

# ---------- Offset / Schema History（Redis 存储） ----------
# 与 MySQL 实例共用一个 Redis，key 按 source 隔离（product），见 deploy/debezium 同段注释
debezium.source.offset.storage=io.debezium.storage.redis.offset.RedisOffsetBackingStore
debezium.source.offset.storage.redis.address=redis:6379
debezium.source.offset.storage.redis.key=metadata:debezium:offsets:product
debezium.source.offset.flush.interval.ms=10000
debezium.source.schema.history.internal=io.debezium.storage.redis.history.RedisSchemaHistory
debezium.source.schema.history.internal.redis.address=redis:6379
debezium.source.schema.history.internal.redis.key=metadata:debezium:schema_history:product

# ---------- Converters（纯 JSON，不含 schema） ----------
debezium.source.key.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.value.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.key.converter.schemas.enable=false
debezium.source.value.converter.schemas.enable=false

# ---------- Sink: Redis Stream ----------
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379
debezium.sink.redis.record.key.mapper=io.debezium.server.redis.RedisStandardRecordKey
debezium.sink.redis.stream.name.mapper=topic
debezium.sink.redis.field.name=payload

# ---------- Heartbeat ----------
# 空闲期定期发心跳；默认 Redis sink 会跳过心跳消息（skip.heartbeat.messages=true），
# 显式关掉让心跳落进 Redis stream（__debezium-heartbeat 前缀），作为端到端 CDC 活性信号。
# 心跳 stream 无消费者，间隔取 60s 控制堆积（约 1440 条/天）。
debezium.source.heartbeat.interval.ms=60000
debezium.sink.redis.skip.heartbeat.messages=false

# ---------- HTTP 端点（Quarkus） ----------
# 镜像默认监听 8080，与 compose 暴露的 8082 对不上导致宿主机 curl 不通；对齐到 8082，
# 宿主机可通过 http://localhost:8082/q/health 做健康检查
quarkus.http.port=8082

# ---------- Logging ----------
quarkus.log.console.json=false
debezium.log.level=INFO
