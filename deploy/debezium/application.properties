# Debezium Server 配置：MySQL source -> Redis Stream sink
# 参考：https://debezium.io/documentation/reference/stable/operations/debezium-server.html

# ---------- Source: MySQL ----------
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.hostname=mysql
debezium.source.database.port=3306
debezium.source.database.user=debezium
debezium.source.database.password=debezium
debezium.source.database.dbname=iris_demo
# ---------- 时区口径（T26 定论：不要在这里配时区）----------
# MySQL 的 DATETIME 是无时区字面量。Debezium 对它的换算被<b>写死在 UTC</b>：
#   官方文档《Temporal values without time zones》原文——
#   "Such columns are converted into epoch milliseconds or microseconds … by using UTC."
# 即字面 2026-08-30 11:42:50 一律产出 epoch(2026-08-30T11:42:50Z)=1788090170000，
# 与数据库/会话/JVM/容器的时区统统无关。
#
# 【已实证：没有任何配置项能改变 DATETIME 的换算】
#   2026-09-10 依次验证并全部否决（每次均删位点重新快照后比对同一行的载荷毫秒值）：
#   1) debezium.source.connectionTimeZone=Asia/Shanghai —— 无效。该键确实存在
#      （javap 反汇编 MySqlConnectionConfiguration.resolveConnectionTimeZone 可见
#      Strings.defaultIfBlank(config.getString("connectionTimeZone"), "SERVER")），
#      日志也确认已传入连接器，但它只影响 **TIMESTAMP 列**（转 ZonedTimestamp）的时区，
#      对 DATETIME 一字不动。本库 277 列 DATETIME、0 列 TIMESTAMP，故对本案完全空操作。
#   2) debezium.source.database.serverTimezone=Asia/Shanghai —— 无效，且该键在
#      debezium-connector-mysql 3.6.2 里根本不存在（全 jar 扫描无此字面量），
#      那是 MySQL JDBC 驱动时代的 URL 参数，写了会被静默忽略。
#
# 【结论与正确做法】
#   数据基准**恒为「DATETIME 字面量按 UTC 解释」**，不要试图在 Debezium 侧改它。
#   Agent 侧必须与之一致：DefaultAgentService.nowAnchor() 的日界用 **UTC 边界**
#   （见该方法的 DATA_ZONE 常量）。两侧任一侧改成 +08:00，都会让「8/30 有多少笔订单」
#   从 1217 变成 790（实测差值，8 小时错位）。
#   若确实需要 +08:00 语义，只能在<b>应用侧</b>换算：把毫秒值按 UTC 还原成字面量
#   （LocalDateTime.ofEpochMilli(v, UTC)），再当作 +08:00 业务时间使用/展示。
# 变更生效条件：删 Redis 位点 + 重新快照（仅改配置不会重算已有数据的毫秒值）。
debezium.source.topic.prefix=iris
debezium.source.database.server.id=85744
# 电商数据集捕获：iris_demo 库全量，**排除 10 张高频日志/流水表**（2026-09-11）
# 它们是纯追加型流水（订单状态流转/积分/余额/登录等），无查询复用价值，
# 却占 CDC 事件量大头（仅 ord_order_status_log 就 20 万行快照）。
# 注意：log_* 前缀是「物流(logistics)」不是「日志」——log_company/log_pickup_point
# 是维表、log_logistics* 是运单/包裹/轨迹业务数据，全部保留，别按前缀误杀。
# 【实测 2026-09-11】include.list 与 exclude.list **不允许并存**（校验器直接拒绝：
# "table.exclude.list" value is invalid: "table.include.list" is already specified），
# 原 include.list=iris_demo.* 本就是全库语义，删除之，仅留 exclude.list。
# 名单与 deploy/verify/cdc-excluded-tables.txt 保持一致。
debezium.source.table.exclude.list=iris_demo\\.ord_order_status_log,iris_demo\\.afc_after_sale_log,iris_demo\\.base_admin_login_log,iris_demo\\.ops_job_log,iris_demo\\.pay_merchant_balance_log,iris_demo\\.prd_price_change_log,iris_demo\\.usr_member_balance_log,iris_demo\\.usr_member_level_log,iris_demo\\.usr_member_login_log,iris_demo\\.usr_member_point_log
debezium.source.snapshot.mode=initial
# DECIMAL 默认编码为 base64 字节串（如 "ANc8"），查询索引无法解析；改 double 直接输出数值
debezium.source.decimal.handling.mode=double
# 关闭 delete 后的 tombstone 事件（Redis Stream sink 会把 tombstone 写成裸字符串，消费端无意义）
debezium.source.tombstones.on.delete=false

# ---------- Offset / Schema History（Redis 存储，T6 对标 RDI） ----------
# 官方 RDI 位点存 Redis；开源 Debezium Server 提供 debezium-storage-redis 模块等价实现。
# 容器/卷重建后从 Redis 位点续传，不重放快照（此前 FileOffsetBackingStore 会丢位点）。
# 注意：debezium-server-redis 里的 io.debezium.server.redis.RedisOffsetBackingStore 已标记
# @Deprecated，这里直接用新包 io.debezium.storage.redis.*。
debezium.source.offset.storage=io.debezium.storage.redis.offset.RedisOffsetBackingStore
debezium.source.offset.storage.redis.address=redis:6379
# 两个 Debezium 实例（customer/product）共用一个 Redis，key 必须按 source 隔离，
# 否则两边的位点/建表历史互相覆盖
debezium.source.offset.storage.redis.key=metadata:debezium:offsets:ecomm
debezium.source.offset.flush.interval.ms=10000
debezium.source.schema.history.internal=io.debezium.storage.redis.history.RedisSchemaHistory
debezium.source.schema.history.internal.redis.address=redis:6379
debezium.source.schema.history.internal.redis.key=metadata:debezium:schema_history:ecomm

# ---------- Converters（纯 JSON，不含 schema） ----------
debezium.source.key.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.value.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.key.converter.schemas.enable=false
debezium.source.value.converter.schemas.enable=false

# ---------- 不启用 unwrap SMT ----------
# 直接消费 Debezium 原始 envelope（op + before + after），由 redis-iris-java cdc 模块负责事件转换，
# 这样 delete 事件语义清晰（op=d, before=旧行, after=null），见方案 3.2「事件转换」归属 cdc。

# ---------- Sink: Redis Stream ----------
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379
debezium.sink.redis.record.key.mapper=io.debezium.server.redis.RedisStandardRecordKey
debezium.sink.redis.stream.name.mapper=topic
debezium.sink.redis.field.name=payload

# ---------- Heartbeat ----------
# 空闲期定期发心跳，推进 binlog 位点防止被 MySQL purge；
# 默认 Redis sink 会跳过心跳消息（skip.heartbeat.messages=true），这里显式关掉让心跳落进
# Redis stream（__debezium-heartbeat 前缀），作为端到端 CDC 活性信号。
# 心跳 stream 无消费者，间隔取 60s 控制堆积（约 1440 条/天）。
debezium.source.heartbeat.interval.ms=60000
debezium.sink.redis.skip.heartbeat.messages=false

# ---------- HTTP 端点（Quarkus） ----------
# 镜像默认监听 8080，与 compose 暴露的 8081 对不上导致宿主机 curl 不通；对齐到 8081，
# 宿主机可通过 http://localhost:8081/q/health 做健康检查
quarkus.http.port=8081

# ---------- Logging ----------
quarkus.log.console.json=false
debezium.log.level=INFO
