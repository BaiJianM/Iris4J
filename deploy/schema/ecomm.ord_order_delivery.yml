namespace: ecomm
entity: ord_order_delivery
description: 订单发货单主表
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: delivery_no
    type: STRING
    index: tag
    description: 配送单号
  - name: order_id
    type: LONG
    index: numeric
    relatedEntity: ord_order
    description: 外键关联 ord_order
  - name: shop_id
    type: LONG
    index: numeric
    relatedEntity: mch_shop
    description: 外键关联 mch_shop
  - name: warehouse_id
    type: LONG
    index: numeric
    relatedEntity: stk_warehouse
    description: 外键关联 stk_warehouse
  - name: logistics_id
    type: LONG
    index: numeric
    relatedEntity: log_logistics
    description: 外键关联 log_logistics
  - name: ship_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: order_no
    type: STRING
    index: tag
    description: 订单号
  - name: delivery_status
    type: INT
    index: numeric
    description: 配送状态
    values: 0=待发货; 1=已发货; 2=已签收; 3=已退回
  - name: total_quantity
    type: INT
    index: numeric
    description: 合计数量
  - name: receiver
    type: STRING
    index: tag
    description: 收货人
  - name: receiver_mobile
    type: STRING
    index: tag
    description: 收货人手机号
  - name: receiver_address
    type: STRING
    index: text
    description: 收货人地址
  - name: receive_at
    type: LONG
    index: numeric
    description: 收货时间（毫秒时间戳）
  - name: operator_id
    type: LONG
    index: numeric
    description: 操作人ID
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
