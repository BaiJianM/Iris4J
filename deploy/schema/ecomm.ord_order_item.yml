namespace: ecomm
entity: ord_order_item
description: 订单商品行明细
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: order_id
    type: LONG
    index: numeric
    relatedEntity: ord_order
    description: 外键关联 ord_order
  - name: pay_status
    type: INT
    index: numeric
    carriedFrom: order_id->ord_order.pay_status
    description: 支付状态（投影期从主表 ord_order 携带，销量/金额类统计按此过滤成交标准）
    values: 0=未付; 1=已付; 2=已退款; 3=部分退款
  - name: shop_id
    type: LONG
    index: numeric
    relatedEntity: mch_shop
    description: 外键关联 mch_shop
  - name: product_id
    type: LONG
    index: numeric
    relatedEntity: prd_product
    description: 外键关联 prd_product
  - name: sku_id
    type: LONG
    index: numeric
    relatedEntity: prd_sku
    description: 外键关联 prd_sku
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: order_no
    type: STRING
    index: tag
    description: 订单号
  - name: product_name
    type: STRING
    index: text
    description: 商品名称
  - name: sku_name
    type: STRING
    index: text
    description: SKU 名称
  - name: sku_spec
    type: STRING
    index: tag
    description: SKU规格
  - name: main_image
    type: STRING
    index: tag
    description: 主营图片
  - name: category_id
    type: LONG
    index: numeric
    description: 类目ID
  - name: brand_id
    type: LONG
    index: numeric
    description: 品牌ID
  - name: sale_price
    type: DOUBLE
    index: numeric
    description: 销售价格（元）
  - name: quantity
    type: INT
    index: numeric
    description: 数量
  - name: total_price
    type: DOUBLE
    index: numeric
    description: 合计价格（元）
  - name: discount_amount
    type: DOUBLE
    index: numeric
    description: 折扣金额（元）
  - name: pay_amount
    type: DOUBLE
    index: numeric
    description: 支付金额（元）
  - name: cost_price
    type: DOUBLE
    index: numeric
    description: 成本价格（元）
  - name: commission_rate
    type: DOUBLE
    index: numeric
    description: 佣金比率
  - name: refund_quantity
    type: INT
    index: numeric
    description: 退款数量
  - name: refund_amount
    type: DOUBLE
    index: numeric
    description: 退款金额（元）
  - name: comment_status
    type: INT
    index: numeric
    description: 评论状态
    values: 0=未评; 1=已评; 2=已追评
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
