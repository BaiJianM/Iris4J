namespace: ecomm
entity: prd_sku_attribute
description: SKU 规格属性组合
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: sku_id
    type: LONG
    index: numeric
    relatedEntity: prd_sku
    description: 外键关联 prd_sku
  - name: attr_id
    type: LONG
    index: numeric
    relatedEntity: prd_attribute
    description: 外键关联 prd_attribute
  - name: value_id
    type: LONG
    index: numeric
    relatedEntity: prd_attribute_value
    description: 外键关联 prd_attribute_value
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: attr_name
    type: STRING
    index: text
    description: 属性名
  - name: value_name
    type: STRING
    index: text
    description: 值名称
