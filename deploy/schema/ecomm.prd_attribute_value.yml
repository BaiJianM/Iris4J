namespace: ecomm
entity: prd_attribute_value
description: 属性可选值字典
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: attr_id
    type: LONG
    index: numeric
    relatedEntity: prd_attribute
    description: 外键关联 prd_attribute
  - name: value_name
    type: STRING
    index: tag
    description: 值名称
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: image_url
    type: STRING
    index: tag
    description: 图片地址
  - name: sort
    type: INT
    index: numeric
    description: 排序值（小在前）
  - name: status
    type: INT
    index: numeric
    description: 状态码
    values: 0=停用; 1=启用
