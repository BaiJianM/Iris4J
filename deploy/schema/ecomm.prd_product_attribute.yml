namespace: ecomm
entity: prd_product_attribute
description: 商品属性值关联
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: product_id
    type: LONG
    index: numeric
    relatedEntity: prd_product
    description: 外键关联 prd_product
  - name: attr_id
    type: LONG
    index: numeric
    relatedEntity: prd_attribute
    description: 外键关联 prd_attribute
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: attr_name
    type: STRING
    index: text
    description: 属性名
  - name: attr_value
    type: STRING
    index: tag
    description: 属性值
  - name: sort
    type: INT
    index: numeric
    description: 排序值（小在前）
