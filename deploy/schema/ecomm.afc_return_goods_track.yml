namespace: ecomm
entity: afc_return_goods_track
description: 退货回寄物流跟踪记录
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: return_id
    type: LONG
    index: numeric
    relatedEntity: afc_return_goods
    description: 外键关联 afc_return_goods
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: track_desc
    type: STRING
    index: text
    description: 轨迹描述
  - name: node_time
    type: LONG
    index: numeric
    description: 节点时间（毫秒时间戳）
  - name: sort
    type: INT
    index: numeric
    description: 排序值（小在前）
