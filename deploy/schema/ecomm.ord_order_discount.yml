namespace: ecomm
entity: ord_order_discount
description: 订单优惠分摊明细（券/活动）
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: order_id
    type: LONG
    index: numeric
    relatedEntity: ord_order
    description: 外键关联 ord_order
  - name: discount_type
    type: INT
    index: numeric
    description: 折扣类型
    values: 1=优惠券; 2=满减活动; 3=限时折扣; 4=秒杀; 5=拼团; 6=会员折扣; 7=积分抵扣; 8=平台补贴
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: ref_id
    type: LONG
    index: numeric
    description: 参考ID
  - name: discount_name
    type: STRING
    index: text
    description: 折扣名称
  - name: discount_amount
    type: DOUBLE
    index: numeric
    description: 折扣金额（元）
  - name: bear_ratio
    type: DOUBLE
    index: numeric
    description: 承担比率
  - name: shop_bear_amount
    type: DOUBLE
    index: numeric
    description: 店铺承担金额（元）
