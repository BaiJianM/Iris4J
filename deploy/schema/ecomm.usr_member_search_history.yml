namespace: ecomm
entity: usr_member_search_history
description: 会员搜索历史
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: member_id
    type: LONG
    index: numeric
    relatedEntity: usr_member
    description: 外键关联 usr_member
  - name: keyword
    type: STRING
    index: tag
    description: 关键词
  - name: search_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: result_count
    type: INT
    index: numeric
    description: 结果次数
  - name: has_order
    type: INT
    index: numeric
    description: 是否有订单（0/1）
    values: 0=否; 1=是
  - name: device
    type: INT
    index: numeric
    description: 设备
    values: 1=iOS; 2=Android; 3=H5; 4=PC; 5=小程序
