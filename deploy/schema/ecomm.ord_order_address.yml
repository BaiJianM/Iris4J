namespace: ecomm
entity: ord_order_address
description: 订单收货地址快照
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: order_id
    type: LONG
    index: numeric
    relatedEntity: ord_order
    description: 外键关联 ord_order
  - name: address_id
    type: LONG
    index: numeric
    relatedEntity: usr_member_address
    description: 外键关联 usr_member_address
  - name: province_id
    type: LONG
    index: numeric
    relatedEntity: base_region
    description: 外键关联 base_region
  - name: city_id
    type: LONG
    index: numeric
    relatedEntity: base_region
    description: 外键关联 base_region
  - name: district_id
    type: LONG
    index: numeric
    relatedEntity: base_region
    description: 外键关联 base_region
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: receiver
    type: STRING
    index: tag
    description: 收货人
  - name: mobile
    type: STRING
    index: tag
    description: 手机号
  - name: province_name
    type: STRING
    index: text
    description: 省份名称
  - name: city_name
    type: STRING
    index: text
    description: 城市名称
  - name: district_name
    type: STRING
    index: text
    description: 区县名称
  - name: address
    type: STRING
    index: text
    description: 详细地址
  - name: zip_code
    type: STRING
    index: tag
    description: 邮政编码
