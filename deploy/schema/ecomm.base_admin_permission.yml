namespace: ecomm
entity: base_admin_permission
description: 后台权限点定义（RBAC 权限模型）
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: parent_id
    type: LONG
    index: numeric
    description: 父级ID
  - name: perm_code
    type: STRING
    index: tag
    description: 权限点编码
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: perm_name
    type: STRING
    index: text
    description: 权限点名称
  - name: perm_type
    type: INT
    index: numeric
    description: 权限点类型
    values: 1=目录; 2=菜单; 3=按钮
  - name: path
    type: STRING
    index: tag
    description: 路径
  - name: sort
    type: INT
    index: numeric
    description: 排序值（小在前）
  - name: status
    type: INT
    index: numeric
    description: 状态码
    values: 0=停用; 1=启用
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
