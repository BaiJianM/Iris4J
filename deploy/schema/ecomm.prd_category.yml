namespace: ecomm
entity: prd_category
description: 商品类目树
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: parent_id
    type: LONG
    index: numeric
    relatedEntity: prd_category
    description: 外键关联 prd_category
  - name: category_code
    type: STRING
    index: tag
    description: 类目编码
  - name: level
    type: INT
    index: numeric
    description: 等级
  - name: is_show
    type: INT
    index: numeric
    description: 是否展示
    values: 0=否; 1=是
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: category_name
    type: STRING
    index: text
    description: 类目名称
  - name: path
    type: STRING
    index: tag
    description: 路径
  - name: icon_url
    type: STRING
    index: tag
    description: 图标地址
  - name: image_url
    type: STRING
    index: tag
    description: 图片地址
  - name: commission_rate
    type: DOUBLE
    index: numeric
    description: 佣金比率
  - name: sort
    type: INT
    index: numeric
    description: 排序值（小在前）
  - name: status
    type: INT
    index: numeric
    description: 状态码
    values: 0=停用; 1=启用
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
