namespace: ecomm
entity: mkt_discount
description: 商品直降折扣活动
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: shop_id
    type: LONG
    index: numeric
    relatedEntity: mch_shop
    description: 外键关联 mch_shop
  - name: status
    type: INT
    index: numeric
    description: 状态码
    values: 0=未开始; 1=进行中; 2=已结束; 3=已下线
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: discount_name
    type: STRING
    index: text
    description: 折扣名称
  - name: discount_rate
    type: DOUBLE
    index: numeric
    description: 折扣比率
  - name: start_time
    type: LONG
    index: numeric
    description: 开始时间（毫秒时间戳）
  - name: end_time
    type: LONG
    index: numeric
    description: 结束时间（毫秒时间戳）
  - name: limit_per_user
    type: INT
    index: numeric
    description: 每人限领数量
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
