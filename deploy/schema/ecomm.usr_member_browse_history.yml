namespace: ecomm
entity: usr_member_browse_history
description: 会员商品浏览足迹
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: member_id
    type: LONG
    index: numeric
    relatedEntity: usr_member
    description: 外键关联 usr_member
  - name: product_id
    type: LONG
    index: numeric
    relatedEntity: prd_product
    description: 外键关联 prd_product
  - name: sku_id
    type: LONG
    index: numeric
    relatedEntity: prd_sku
    description: 外键关联 prd_sku
  - name: view_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: source
    type: INT
    index: numeric
    description: 来源
    values: 1=首页; 2=搜索; 3=分类; 4=推荐; 5=收藏; 6=购物车
  - name: stay_seconds
    type: INT
    index: numeric
    description: 驻留秒
  - name: device
    type: INT
    index: numeric
    description: 设备
    values: 1=iOS; 2=Android; 3=H5; 4=PC; 5=小程序
