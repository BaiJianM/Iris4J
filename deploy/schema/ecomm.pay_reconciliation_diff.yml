namespace: ecomm
entity: pay_reconciliation_diff
description: 对账差异明细
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: recon_id
    type: LONG
    index: numeric
    relatedEntity: pay_reconciliation
    description: 外键关联 pay_reconciliation
  - name: payment_no
    type: STRING
    index: tag
    description: 支付单号
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: order_no
    type: STRING
    index: tag
    description: 订单号
  - name: diff_type
    type: INT
    index: numeric
    description: 差异类型
    values: 1=金额不一致; 2=渠道多账; 3=本地多账; 4=状态不一致
  - name: bill_amount
    type: DOUBLE
    index: numeric
    description: 账单金额（元）
  - name: local_amount
    type: DOUBLE
    index: numeric
    description: 本地金额（元）
  - name: diff_amount
    type: DOUBLE
    index: numeric
    description: 差异金额（元）
  - name: handle_status
    type: INT
    index: numeric
    description: 处理状态码
    values: 0=未处理; 1=已补单; 2=已退款; 3=已挂账; 4=已忽略
  - name: handle_remark
    type: STRING
    index: text
    description: 处理备注
  - name: handle_at
    type: LONG
    index: numeric
    description: 处理时间（毫秒时间戳）
