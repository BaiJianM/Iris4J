namespace: ecomm
entity: cart_checkout_snapshot
description: 结算页快照，下单时点购物车商品与价格的定格
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: snapshot_no
    type: STRING
    index: tag
    description: 快照单号
  - name: member_id
    type: LONG
    index: numeric
    relatedEntity: usr_member
    description: 外键关联 usr_member
  - name: expire_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: cart_id
    type: LONG
    index: numeric
    description: 购物车ID
  - name: address_id
    type: LONG
    index: numeric
    description: 地址ID
  - name: goods_amount
    type: DOUBLE
    index: numeric
    description: 商品金额（元）
  - name: discount_amount
    type: DOUBLE
    index: numeric
    description: 折扣金额（元）
  - name: freight_amount
    type: DOUBLE
    index: numeric
    description: 运费金额（元）
  - name: pay_amount
    type: DOUBLE
    index: numeric
    description: 支付金额（元）
  - name: coupon_id
    type: LONG
    index: numeric
    description: 优惠券ID
  - name: status
    type: INT
    index: numeric
    description: 状态码
    values: 0=待下单; 1=已下单; 2=已过期
