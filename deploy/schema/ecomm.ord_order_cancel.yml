namespace: ecomm
entity: ord_order_cancel
description: 订单取消记录
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: order_id
    type: LONG
    index: numeric
    relatedEntity: ord_order
    description: 外键关联 ord_order
  - name: cancel_type
    type: INT
    index: numeric
    description: 取消类型
    values: 1=用户主动; 2=超时未付; 3=商家缺货; 4=风控拦截; 5=客服操作
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: order_no
    type: STRING
    index: tag
    description: 订单号
  - name: cancel_reason
    type: STRING
    index: tag
    description: 取消原因
  - name: operator_type
    type: INT
    index: numeric
    description: 操作人类型
    values: 1=会员; 2=商家; 3=系统; 4=平台
  - name: operator_id
    type: LONG
    index: numeric
    description: 操作人ID
  - name: refund_flag
    type: INT
    index: numeric
    description: 退款标记
    values: 0=否; 1=是
