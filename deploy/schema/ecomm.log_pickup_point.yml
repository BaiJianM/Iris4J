namespace: ecomm
entity: log_pickup_point
description: 自提点档案
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: point_code
    type: STRING
    index: tag
    description: 积分编码
  - name: province_id
    type: LONG
    index: numeric
    relatedEntity: base_region
    description: 外键关联 base_region
  - name: city_id
    type: LONG
    index: numeric
    relatedEntity: base_region
    description: 外键关联 base_region
  - name: district_id
    type: LONG
    index: numeric
    relatedEntity: base_region
    description: 外键关联 base_region
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: point_name
    type: STRING
    index: text
    description: 积分名称
  - name: address
    type: STRING
    index: text
    description: 详细地址
  - name: contact_name
    type: STRING
    index: text
    description: 联系人姓名
  - name: contact_phone
    type: STRING
    index: tag
    description: 联系电话
  - name: business_hours
    type: STRING
    index: tag
    description: 业务小时
  - name: longitude
    type: DOUBLE
    index: numeric
    description: 经度
  - name: latitude
    type: DOUBLE
    index: numeric
    description: 纬度
  - name: capacity
    type: INT
    index: numeric
    description: 库容
  - name: status
    type: INT
    index: numeric
    description: 状态码
    values: 0=停用; 1=启用
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
