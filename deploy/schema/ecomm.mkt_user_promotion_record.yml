namespace: ecomm
entity: mkt_user_promotion_record
description: 会员参与营销活动的记录
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: member_id
    type: LONG
    index: numeric
    relatedEntity: usr_member
    description: 外键关联 usr_member
  - name: activity_type
    type: INT
    index: numeric
    description: 活动类型
    values: 1=优惠券; 2=满减; 3=秒杀; 4=拼团; 5=折扣
  - name: activity_id
    type: LONG
    index: numeric
    relatedEntity: mkt_seckill_activity
    description: 外键关联 mkt_seckill_activity
  - name: order_id
    type: LONG
    index: numeric
    relatedEntity: ord_order
    description: 外键关联 ord_order
  - name: join_count
    type: INT
    index: numeric
    description: 加入次数
  - name: discount_amount
    type: DOUBLE
    index: numeric
    description: 折扣金额（元）
  - name: join_at
    type: LONG
    index: numeric
    description: 加入时间（毫秒时间戳）
