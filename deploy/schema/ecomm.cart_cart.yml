namespace: ecomm
entity: cart_cart
description: 购物车主表（按会员维度）
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: member_id
    type: LONG
    index: numeric
    relatedEntity: usr_member
    description: 外键关联 usr_member
  - name: status
    type: INT
    index: numeric
    description: 状态码
    values: 1=有效; 2=已结算; 3=已废弃
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: updated_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: total_qty
    type: INT
    index: numeric
    description: 合计数量
  - name: total_amount
    type: DOUBLE
    index: numeric
    description: 合计金额（元）
  - name: check_qty
    type: INT
    index: numeric
    description: 核查数量
  - name: check_amount
    type: DOUBLE
    index: numeric
    description: 核查金额（元）
  - name: source
    type: INT
    index: numeric
    description: 来源
    values: 1=APP; 2=小程序; 3=H5; 4=PC
  - name: last_active_at
    type: LONG
    index: numeric
    description: 最近有效时间（毫秒时间戳）
