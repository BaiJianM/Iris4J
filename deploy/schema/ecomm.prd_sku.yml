namespace: ecomm
entity: prd_sku
description: SKU 表（销售最小单元，含价格与库存）
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: sku_no
    type: STRING
    index: tag
    description: SKU单号
  - name: product_id
    type: LONG
    index: numeric
    relatedEntity: prd_product
    description: 外键关联 prd_product
  - name: barcode
    type: STRING
    index: tag
    description: 条码
  - name: sale_price
    type: DOUBLE
    index: numeric
    description: 销售价格（元）
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: sku_name
    type: STRING
    index: text
    description: SKU 名称
  - name: spec_value
    type: STRING
    index: tag
    description: 规格值
  - name: market_price
    type: DOUBLE
    index: numeric
    description: 市场价格（元）
  - name: cost_price
    type: DOUBLE
    index: numeric
    description: 成本价格（元）
  - name: weight
    type: DOUBLE
    index: numeric
    description: 重量（kg）
  - name: volume
    type: DOUBLE
    index: numeric
    description: 销量
  - name: image_url
    type: STRING
    index: tag
    description: 图片地址
  - name: sale_count
    type: INT
    index: numeric
    description: 销售次数
  - name: shelf_status
    type: INT
    index: numeric
    description: 上架状态
    values: 0=下架; 1=上架
  - name: is_default
    type: INT
    index: numeric
    description: 默认标记（0/1）
    values: 0=否; 1=是
  - name: is_deleted
    type: INT
    index: numeric
    description: 软删除标记（0/1）
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
