namespace: ecomm
entity: pay_settlement_item
description: 结算单商品明细
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: batch_id
    type: LONG
    index: numeric
    relatedEntity: pay_settlement_batch
    description: 外键关联 pay_settlement_batch
  - name: order_id
    type: LONG
    index: numeric
    relatedEntity: ord_order
    description: 外键关联 ord_order
  - name: shop_id
    type: LONG
    index: numeric
    relatedEntity: mch_shop
    description: 外键关联 mch_shop
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: order_no
    type: STRING
    index: tag
    description: 订单号
  - name: goods_amount
    type: DOUBLE
    index: numeric
    description: 商品金额（元）
  - name: freight_amount
    type: DOUBLE
    index: numeric
    description: 运费金额（元）
  - name: commission_amount
    type: DOUBLE
    index: numeric
    description: 佣金金额（元）
  - name: refund_amount
    type: DOUBLE
    index: numeric
    description: 退款金额（元）
  - name: settle_amount
    type: DOUBLE
    index: numeric
    description: 结算金额（元）
  - name: settle_status
    type: INT
    index: numeric
    description: 结算状态
    values: 0=待结算; 1=已结算; 2=已驳回
