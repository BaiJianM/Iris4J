namespace: ecomm
entity: mkt_seckill_activity
description: 秒杀活动主表
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: start_time
    type: LONG
    index: numeric
    description: 开始时间（毫秒时间戳）
  - name: status
    type: INT
    index: numeric
    description: 状态码
    values: 0=未开始; 1=进行中; 2=已结束; 3=已下线
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: activity_name
    type: STRING
    index: text
    description: 活动名称
  - name: session_name
    type: STRING
    index: text
    description: 会话名称
  - name: end_time
    type: LONG
    index: numeric
    description: 结束时间（毫秒时间戳）
  - name: limit_quantity
    type: INT
    index: numeric
    description: 限制数量
  - name: participant_count
    type: INT
    index: numeric
    description: 参与人次数
  - name: order_count
    type: INT
    index: numeric
    description: 订单次数
  - name: sale_amount
    type: DOUBLE
    index: numeric
    description: 销售金额（元）
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
