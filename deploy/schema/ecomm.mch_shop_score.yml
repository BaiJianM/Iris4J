namespace: ecomm
entity: mch_shop_score
description: 店铺评分与考核记录
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: shop_id
    type: LONG
    index: numeric
    relatedEntity: mch_shop
    description: 外键关联 mch_shop
  - name: order_id
    type: LONG
    index: numeric
    relatedEntity: ord_order
    description: 外键关联 ord_order
  - name: member_id
    type: LONG
    index: numeric
    relatedEntity: usr_member
    description: 外键关联 usr_member
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: score_desc
    type: INT
    index: numeric
    description: 描述评分
  - name: score_service
    type: INT
    index: numeric
    description: 服务评分
  - name: score_logistics
    type: INT
    index: numeric
    description: 物流评分
