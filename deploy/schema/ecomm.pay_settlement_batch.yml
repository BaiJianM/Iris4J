namespace: ecomm
entity: pay_settlement_batch
description: 商家结算批次
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: batch_no
    type: STRING
    index: tag
    description: 批次单号
  - name: period_start
    type: LONG
    index: numeric
    description: 账期开始日
  - name: period_end
    type: LONG
    index: numeric
    description: 账期结束日
  - name: status
    type: INT
    index: numeric
    description: 状态码
    values: 0=生成中; 1=待审核; 2=已审核; 3=已打款; 4=已作废
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: shop_id
    type: LONG
    index: numeric
    description: 店铺ID
  - name: shop_count
    type: INT
    index: numeric
    description: 店铺次数
  - name: order_count
    type: INT
    index: numeric
    description: 订单次数
  - name: goods_amount
    type: DOUBLE
    index: numeric
    description: 商品金额（元）
  - name: commission_amount
    type: DOUBLE
    index: numeric
    description: 佣金金额（元）
  - name: refund_amount
    type: DOUBLE
    index: numeric
    description: 退款金额（元）
  - name: settle_amount
    type: DOUBLE
    index: numeric
    description: 结算金额（元）
  - name: operator_id
    type: LONG
    index: numeric
    description: 操作人ID
  - name: audit_at
    type: LONG
    index: numeric
    description: 审核时间（毫秒时间戳）
  - name: finish_at
    type: LONG
    index: numeric
    description: 完成时间（毫秒时间戳）
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
