namespace: ecomm
entity: pay_payment
description: 支付单主表，记录每笔支付的渠道与状态
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: payment_no
    type: STRING
    index: tag
    description: 支付单号
  - name: order_id
    type: LONG
    index: numeric
    relatedEntity: ord_order
    description: 外键关联 ord_order
  - name: member_id
    type: LONG
    index: numeric
    relatedEntity: usr_member
    description: 外键关联 usr_member
  - name: channel_id
    type: LONG
    index: numeric
    relatedEntity: pay_channel
    description: 外键关联 pay_channel
  - name: pay_status
    type: INT
    index: numeric
    description: 支付状态
    values: 0=待支付; 1=支付中; 2=成功; 3=失败; 4=已关闭; 5=已退款; 6=部分退款
  - name: channel_trade_no
    type: STRING
    index: tag
    description: 渠道交易单号
  - name: paid_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: order_no
    type: STRING
    index: tag
    description: 订单号
  - name: pay_type
    type: INT
    index: numeric
    description: 支付类型
    values: 1=微信; 2=支付宝; 3=银行卡; 4=余额; 5=货到付款
  - name: amount
    type: DOUBLE
    index: numeric
    description: 金额（元）
  - name: balance_amount
    type: DOUBLE
    index: numeric
    description: 余额金额（元）
  - name: cash_amount
    type: DOUBLE
    index: numeric
    description: 现金金额（元）
  - name: fee_amount
    type: DOUBLE
    index: numeric
    description: 费用金额（元）
  - name: refund_amount
    type: DOUBLE
    index: numeric
    description: 退款金额（元）
  - name: expire_at
    type: LONG
    index: numeric
    description: 过期时间（毫秒时间戳）
  - name: fail_reason
    type: STRING
    index: tag
    description: 失败原因
  - name: client_ip
    type: STRING
    index: tag
    description: 客户端IP 地址
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
