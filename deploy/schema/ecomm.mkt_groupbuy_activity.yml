namespace: ecomm
entity: mkt_groupbuy_activity
description: 拼团活动主表
primaryKeys:
  - id
fields:
  - name: id
    type: LONG
    indexed: true
    description: 主键
  - name: product_id
    type: LONG
    index: numeric
    relatedEntity: prd_product
    description: 外键关联 prd_product
  - name: sku_id
    type: LONG
    index: numeric
    relatedEntity: prd_sku
    description: 外键关联 prd_sku
  - name: status
    type: INT
    index: numeric
    description: 状态码
    values: 0=未开始; 1=进行中; 2=已结束
  - name: created_at
    type: LONG
    index: numeric
    description: 毫秒时间戳
  - name: activity_name
    type: STRING
    index: text
    description: 活动名称
  - name: group_price
    type: DOUBLE
    index: numeric
    description: 分组价格（元）
  - name: original_price
    type: DOUBLE
    index: numeric
    description: 原价价格（元）
  - name: need_count
    type: INT
    index: numeric
    description: 需求次数
  - name: valid_hours
    type: INT
    index: numeric
    description: 有效小时
  - name: limit_per_user
    type: INT
    index: numeric
    description: 每人限领数量
  - name: team_count
    type: INT
    index: numeric
    description: 团队次数
  - name: success_count
    type: INT
    index: numeric
    description: 成功次数
  - name: start_time
    type: LONG
    index: numeric
    description: 开始时间（毫秒时间戳）
  - name: end_time
    type: LONG
    index: numeric
    description: 结束时间（毫秒时间戳）
  - name: updated_at
    type: LONG
    index: numeric
    description: 更新时间（毫秒时间戳）
