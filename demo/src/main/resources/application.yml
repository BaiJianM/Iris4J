      # 多源 CDC 扩展点：需要时在 ecomm 命名空间为其他数据源（如 PG 库）
      # 另配 source 即可恢复多源验证路径。
    # 可靠性（毒消息防护）：处理失败的消息留在 PEL；每 reclaim-interval-ms 扫描一次，
    # 空闲超 claim-idle-ms 的消息重试，投递次数达到 max-deliveries 转 DLQ（{stream}:dlq）。
    max-deliveries: 3
    # 本值必须显著大于"最坏一批的处理耗时"。若单批处理耗时超过它（如全量导入
    # 310 万积压时每批 >>3 秒），reclaim 任务会把**本实例正在处理**的消息当
    # "过期未确认"抢走再处理一遍：算力浪费一半（排空速率掉到约 1000 条/秒，
    # 单实例能力约 2500 条/秒），且第二次处理撞上 2 秒命令超时后按
    # max-deliveries 被判毒消息入 DLQ（error 多为 RedisCommandTimeoutException）。
    claim-idle-ms: 30000
    reclaim-interval-ms: 15000
